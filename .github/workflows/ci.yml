name: CI Pipeline

# ---------- TRIGGERS ----------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:            # "Run workflow" button in the Actions tab

# Cancel an older run on the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token for every job
permissions:
  contents: read

jobs:
  # ---------- STAGE 1: LINT ----------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  # ---------- STAGE 2: TEST (matrix) ----------
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint                 # only runs if lint passed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # let every version finish even if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest -v --cov=app --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ---------- STAGE 3: BUILD ----------
  build:
    name: Build package
    needs: test                 # only runs if every test job passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: python -m build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Write job summary
        run: |
          echo "## Build succeeded :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\` by **${{ github.actor }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "Files built:" >> "$GITHUB_STEP_SUMMARY"
          ls dist | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"